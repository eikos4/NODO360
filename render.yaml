# Blueprint Render — https://render.com/docs/blueprint-spec
# Conectar repo: https://github.com/eikos4/NODO360
services:
  - type: web
    name: nodo360-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: >-
      npm install &&
      npx prisma generate --schema=apps/api/prisma/schema.prisma &&
      npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
      npm run build:api &&
      SEED_IF_EMPTY=true npm run seed --workspace=apps/api -- --if-empty
    startCommand: npm run start --workspace=apps/api
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: nodo360-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: AUTO_SEED_DEMO
        value: "true"
      - key: FRONTEND_URL
        value: https://nodo360-web.onrender.com
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_WEB_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_STORAGE_BUCKET
        sync: false
      - key: FIREBASE_WEB_MESSAGING_SENDER_ID
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: FIREBASE_WEB_VAPID_KEY
        sync: false

  - type: web
    name: nodo360-web
    runtime: static
    rootDir: .
    buildCommand: npm install && npm run build:render --workspace=apps/web
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nodo360-api.onrender.com/api

databases:
  - name: nodo360-db
    plan: free
    region: oregon
    databaseName: nodo360
    user: nodo360
