<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#082a20" />
    <title>NodoTrack</title>
    <style>
      html, body { height: 100%; margin: 0; background: #082a20; color: #ecfdf5; font-family: system-ui, sans-serif; }
      main { min-height: 100%; display: grid; place-items: center; padding: 24px; text-align: center; }
      strong { letter-spacing: -0.03em; }
      .accent { color: #34d399; }
      p { margin: 8px 0 0; color: #94a3b8; }
    </style>
  </head>
  <body>
    <main>
      <strong>Nodo<span class="accent">Track</span></strong>
      <p>Cabina</p>
    </main>
  </body>
</html>
