<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1A2E" />
    <title>Nodo360 Operaciones</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0A1A2E; }
      #fallback {
        position: fixed; inset: 0; z-index: 9;
        display: grid; place-items: center; text-align: center;
        padding: 28px; background: #0A1A2E; color: #fff;
        font-family: Roboto, "Noto Sans", system-ui, sans-serif;
      }
      #fallback b { font-size: 26px; }
      #fallback p { margin: 12px 0 0; font-size: 16px; color: #fde68a; max-width: 280px; }
      #fallback button {
        margin-top: 20px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 12px;
        background: #dc2626; color: #fff; font-size: 16px; font-weight: 800;
      }
      #root { min-height: 100vh; }
    </style>
  </head>
  <body>
    <div id="fallback">
      <div>
        <b>NODO360</b>
        <p id="fallback-msg">Cargando…</p>
        <button type="button" id="fallback-retry" hidden onclick="location.reload()">Reintentar</button>
      </div>
    </div>
    <div id="root"></div>
    <script>
      window.__nodoReady = function () {
        var el = document.getElementById('fallback');
        if (el) el.remove();
      };
      setTimeout(function () {
        if (!document.getElementById('fallback')) return;
        var msg = document.getElementById('fallback-msg');
        var btn = document.getElementById('fallback-retry');
        if (msg) msg.textContent = 'Si no aparece el login, actualizá WebView y Chrome.';
        if (btn) btn.hidden = false;
      }, 5000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
